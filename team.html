<!DOCTYPE html>
<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="nav" id="nav">
  <div class="wrap">
    <a href="index.html"><img class="nav-logo" src="logo.png" alt="CSA Western logo"></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="team.html" class="active">Our Team</a></li>

    <a href="contact.html" class="btn-contact">Contact</a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">&#9776;</button>
  </div>
</nav>

<header class="page-hero">
  <h1>Our Team</h1>
</header>

<section>
  <div class="wrap">

    <!-- data-generated departments -->
    <div id="teamRoot"></div>

  </div>
</section>

<footer>
  &copy; 2026 CSA Western — Chinese Students Association at Western University
</footer>

<script src="nav.js"></script>
<script>
const teamData = [
  { dept: "Presidents", members: [
    { name: "Selina Lim", role: "President", photo: "Selina Lim.jpg" },
    { name: "Gloria Huang", role: "President", photo: "Gloria Huang.jpg" },
  ]},
  { dept: "Events", members: [
    { name: "Daniel Su", role: "VP Events", photo: "Daniel Su.jpg" },
    { name: "Cassidy Lee", role: "Director, Events", photo: "Cassidy Lee.jpg" },
    { name: "Jessica Zhang", role: "Director, Events", photo: "Jessica Zhang.jpg" },
  ]},
  { dept: "Finance", members: [
    { name: "Callista Chan", role: "VP Finance", photo: "Callista Chan.jpg" },
    { name: "Michael Tan", role: "Director, Finance", photo: "Michael Tan.jpg" },
    { name: "Jason Zhuang", role: "Director, Finance", photo: "Jason Zhuang.jpg" },
  ]},
  { dept: "Graphics", members: [
    { name: "Harry Yang", role: "VP Graphics" },
    { name: "Sarah Gao", role: "Director, Graphics", photo: "Sarah Gao.jpg" },
    { name: "Melissa Zhang", role: "Director, Graphics" },
  ]},
  { dept: "Marketing", members: [
    { name: "Tanya Mai", role: "VP Communications", photo: "Tanya Mai.jpg" },
    { name: "Ava Cheh", role: "Director, Marketing", photo: "Ava Cheh.jpg" },
    { name: "Amelie Hu", role: "Director, Marketing", photo: "Amelie Hu.jpg"},
  ]},
  { dept: "Member Relations", members: [
    { name: "Aleena Liu", role: "VP Internals", photo: "Aleena Liu.jpg" },
    { name: "Kate Chen", role: "Director, Member Relations", photo: "Kate Chen.jpg" },
    { name: "Ray Shen", role: "Director, Member Relations", photo: "Ray Shen.jpg" },
  ]},
  { dept: "Productions", members: [
    { name: "Kevin Li", role: "VP Productions", photo: "Kevin Li.jpg" },
    { name: "William Wang", role: "Director, Productions", photo: "William Wang.jpg" },
    { name: "Lydia Zheng", role: "Director, Productions", photo: "Lydia Zheng.jpg" },
  ]},
];

const root = document.getElementById("teamRoot");
teamData.forEach(section => {
  const deptDiv = document.createElement("div");
  deptDiv.className = "team-dept";
  const h2 = document.createElement("h2");
  h2.textContent = section.dept;
  deptDiv.appendChild(h2);

  const grid = document.createElement("div");
  grid.className = "team-grid";

  section.members.forEach(m => {
    const card = document.createElement("div");
    card.className = "member";
    const photoHtml = m.photo
      ? `<img class="member-photo-img" src="team-photos/${encodeURIComponent(m.photo)}" alt="${m.name}">`
      : `<div class="member-photo" title="Add headshot for ${m.name}">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/>
            <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>`;
    card.innerHTML = `
      ${photoHtml}
      <p class="member-name">${m.name}</p>
      <p class="member-role">${m.role}</p>
    `;
    grid.appendChild(card);
  });

  deptDiv.appendChild(grid);
  root.appendChild(deptDiv);
});
</script>
</body>
</html>
